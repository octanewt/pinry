# Pinry on a LAN, with SQLite in ./data.
#
#   cp .env.example .env              # set SECRET_KEY and ALLOWED_HOSTS
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d --build
#   docker compose exec pinry python manage.py createsuperuser
#
# For PostgreSQL, see docker-compose.postgres.example.yml.
services:
  pinry:
    image: pinry:local
    build:
      context: .
      dockerfile: Dockerfile.autobuild
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - ./data:/data
    restart: unless-stopped
