[tool.poetry]
name = "pinry"
version = "2.1.9"
description = "Pinry, a tiling image board system for people who want to save, tag, and share images, videos and webpages in an easy to skim through format. It's open-source and self-hosted."
authors = ["winkidney <winkidney@gmail.com>"]
license = "BSD 2-Clause"

[tool.poetry.dependencies]
python = ">=3.7"
# Several pins below take a newer release on newer Pythons: the security
# fixes in those releases need Python 3.8 or 3.9+, while CI still tests 3.7.
requests = [
    {version = "^2.31.0", python = "<3.8"},
    {version = "^2.32.4", python = ">=3.8"},
]
urllib3 = [
    {version = "^1.26.20", python = "<3.8"},
    {version = "^2.2.3", python = ">=3.8,<3.9"},
    {version = "^2.5.0", python = ">=3.9"},
]
django = ">2.2.17,<3"
pillow = [
    {version = "^9.5.0", python = "<3.8"},
    {version = "^10.4.0", python = ">=3.8,<3.9"},
    {version = ">=11.3.0", python = ">=3.9"},
]
sqlparse = [
    {version = "^0.4.4", python = "<3.8"},
    {version = ">=0.5.0", python = ">=3.8"},
]
markdown = "*"
django-filter = "==2.4.0"
coreapi = "^2.3.3"
psycopg2-binary = "2.9.9"
django-taggit = "1.3.0"
django-braces = "^1.15.0"
django-compressor = "^4.0"
mock = "^4.0.3"
gunicorn = "^23.0.0"
djangorestframework = "^3.13.1"
# coreapi imports pkg_resources; gunicorn 20 used to pull setuptools in.
setuptools = "*"


[tool.poetry.dev-dependencies]
flake8 = "*"
qrcode = "*"
django-extensions = "*"
mkdocs = "*"
mkdocs-material = "*"
jinja2 = "==3.0.3"
black = "==19.10b0"

[tool.poetry.group.dev.dependencies]
jinja2 = "3.0.3"
mkdocs-material = "8.4.0"
# flake8 3.x calls entry_points().get(), which importlib-metadata 5+ removed;
# on Python 3.7 flake8 uses this backport instead of the stdlib module.
importlib-metadata = {version = "<5", python = "<3.8"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
