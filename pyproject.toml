[project]
name = "pinry"
version = "3.0.0"
description = "Pinry, a tiling image board system for people who want to save, tag, and share images, videos and webpages in an easy to skim through format. It's open-source and self-hosted."
authors = [{name = "winkidney", email = "winkidney@gmail.com"}]
license = "BSD-2-Clause"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-filter>=25.1",
    "django-taggit>=6.1",
    "drf-spectacular[sidecar]>=0.28",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "pillow>=11.3",
    "requests>=2.32.4",
    "urllib3>=2.5",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "flake8>=7",
    "flake8-bugbear>=24",
    "qrcode>=8",
    "django-extensions>=3.2",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
# Pinry is an application, not a library: don't build or install it.
package = false
